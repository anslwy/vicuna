[package]
name = "vicuna-bridge"
version = "0.0.44"
description = "vicuna — the Vicuna CLI: `vicuna serve` (headless server for the desktop app), `vicuna open`, and the dev bridge"
authors = ["you"]
edition = "2024"

[dependencies]
# headless: no `desktop` feature (and no `tauri`), so no WebKit/GTK at build or
# runtime; rustls instead of system OpenSSL — builds statically against musl
vicuna_lib = { package = "vicuna", path = "../src-tauri", default-features = false, features = ["rustls", "whisper"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "macros", "sync", "signal"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = { version = "1", features = ["raw_value"] }
getrandom = "0.3"
sha2 = "0.10"

[[bin]]
name = "vicuna"
path = "src/main.rs"

[package]
name = "vicuna-bridge"
version = "0.0.13"
description = "vicuna — the Vicuna CLI: `vicuna serve` (headless server for the desktop app), `vicuna open`, and the dev bridge"
authors = ["you"]
edition = "2024"

[dependencies]
# headless: no `desktop` feature, so no WebKit/GTK at runtime; rustls instead
# of system OpenSSL — the binary runs on a bare VPS
vicuna_lib = { package = "vicuna", path = "../src-tauri", default-features = false, features = ["rustls"] }
tauri = { version = "2", default-features = false }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "macros"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1"
getrandom = "0.3"

[[bin]]
name = "vicuna"
path = "src/main.rs"

# Vicuna remote worker — local container harness.
#
#   docker compose -f bridge/container/docker-compose.worker.yml up -d --build
#
# Gives you a worker on http://localhost:1422 speaking the protocol in
# bridge/WORKER.md, with:
#   - the Mac's Ollama reachable at host.docker.internal:11434
#   - ./scratch/container as the agent's workspace on the host
#   - a named volume for the token/state, so restarts stay paired
#
# Verify from the host with the same scripts used against a native worker:
#   TOKEN=$(docker compose -f bridge/container/docker-compose.worker.yml \
#             exec worker cat /var/lib/vicuna-worker/worker-token)
#   python3 scripts/check-worker.py --port 1422 --token "$TOKEN" \
#       --workspace ./scratch/container/ws
#
# NOTE: emulated amd64 on Apple silicon. Slow, and Chromium under qemu/rosetta
# is flakier than native — treat a failure here as inconclusive, not a bug.
services:
  worker:
    build:
      # Repo root (core/ + bridge/ are what the worker is built from; the
      # Dockerfile deliberately never touches src-tauri).
      context: ../../
      dockerfile: bridge/container/Dockerfile.worker
    image: vicuna-worker:dev
    platform: linux/amd64
    ports:
      # Loopback only: the agent runs shell commands, so never publish this.
      - "127.0.0.1:1422:1421"
      # The browser UI/API a human uses to watch and take over the agent's tab.
      # `lb web` binds 127.0.0.1 inside the container, so the entrypoint's socat
      # forwarder republishes it on this port. Loopback only, like the worker:
      # this UI can drive a logged-in browser.
      - "127.0.0.1:18766:18766"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Point at the host's Ollama (the container has none of its own).
      VICUNA_OLLAMA_BASE: ${VICUNA_OLLAMA_BASE:-http://host.docker.internal:11434}
      # 0 skips the one-time CloakBrowser download at startup.
      VICUNA_SKIP_ENGINE: ${VICUNA_SKIP_ENGINE:-0}
      LB_BROWSER_VERSION: ${LB_BROWSER_VERSION:-145.0.7632.109.2}
      # Forward the container-loopback lb daemon so the human UI is reachable.
      VICUNA_LB_FORWARD_PORT: ${VICUNA_LB_FORWARD_PORT:-18766}
    volumes:
      - worker-state:/var/lib/vicuna-worker
      - worker-engine:/var/lib/vicuna-engine
      - ./scratch/container:/workspace
    # Chromium + qemu needs more headroom than the defaults.
    shm_size: "1gb"
    security_opt:
      # Matches entrypoint's --no-sandbox note; container has no userns.
      - seccomp=unconfined
    restart: unless-stopped

volumes:
  worker-state:
  worker-engine:

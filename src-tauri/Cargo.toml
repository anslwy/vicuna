[package]
name = "vicuna"
version = "0.0.33"
description = "Vicuna — minimal desktop chat client for Ollama"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vicuna_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The desktop app binary needs the `desktop` feature (window, tray, plugins).
[[bin]]
name = "vicuna"
path = "src/main.rs"
required-features = ["desktop"]

# `desktop` (default) = the Tauri app: WebKit runtime, tray, plugins, every
# #[tauri::command]. The headless server (`vicuna serve`, bridge/ crate) builds
# with `default-features = false, features = ["rustls"]`: `tauri` itself is
# excluded (via `src/ipc.rs`), so Linux builds need no GTK/WebKit headers or
# system OpenSSL and compile statically against musl for x86_64 and aarch64.
[features]
default = ["desktop"]
desktop = [
    "dep:tauri",
    "tauri/default",
    "tauri/tray-icon",
    "dep:tauri-plugin-deep-link",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-notification",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-updater",
    "dep:tauri-plugin-process",
    "dep:tauri-plugin-sql",
    "dep:tauri-plugin-single-instance",
    "reqwest/default-tls",
    "reqwest/macos-system-configuration",
    "dep:tokio-native-tls",
]
# server builds: Rust-native TLS, so no system OpenSSL is needed either
rustls = ["reqwest/rustls-tls"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = [], optional = true }
tauri-plugin-deep-link = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-sql = { version = "2", features = ["sqlite"], optional = true }
# chats_save reuses the plugin's pool (tauri-plugin-sql 2.6 pulls sqlx 0.8) to
# run the chat-history rewrite as ONE transaction — keep versions in lockstep
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
tokio = { version = "1", features = ["time", "process", "io-util", "sync", "rt", "rt-multi-thread", "macros", "fs", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "charset", "http2", "gzip"] }
flate2 = "1"
futures-util = "0.3"
portable-pty = "0.9.0"
# renders /usage PTY output to a screen grid (terminals repaint cells in place)
vt100 = "0.16"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = { version = "0.1" }
bytes = { version = "1" }
tokio-native-tls = { version = "0.3", optional = true }

# A second launch on Windows/Linux (Start menu, taskbar, launcher, deep link)
# focuses the running window instead of opening another Vicuna; macOS already
# does this via LaunchServices. `deep-link` forwards vicuna:// URLs from the
# second process into the first's onOpenUrl.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"], optional = true }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

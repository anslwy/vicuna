# Refresh the Discover catalog from the live Ollama registry (weekly +
# manual). Regenerates src/lib/catalog.ts with all registry models, checks it
# still compiles, and opens/updates a PR so a human reviews new-model
# blurbs/cats before merge. Manual refresh: `npm run catalog:refresh`.
name: Refresh model catalog

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: catalog-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: python3 scripts/refresh-catalog.py

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check

      - name: Open catalog refresh PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "vicuna-bot"
          git config user.email "vicuna-bot@users.noreply.github.com"
          git checkout -B ci/catalog-refresh
          git add src/lib/catalog.ts
          git diff --cached --quiet && { echo "catalog unchanged"; exit 0; }
          git commit -m "Discover catalog refresh ($(date +%F))"
          git push -f origin ci/catalog-refresh
          gh pr create --title "Discover catalog refresh ($(date +%F))" \
            --body "Regenerated by \`npm run catalog:refresh\` (all registry models, sizes from live manifests). Review new-model blurbs/cats before merging." \
            --head ci/catalog-refresh --base main 2>/dev/null \
            || echo "refresh PR already open; branch updated"

# Build the desktop app for macOS / Windows / Linux.
#
# Two modes (same build jobs):
#   * push to main (or a manual run with no version): attach the installers
#     to the rolling `latest` prerelease (dev builds). Dev builds are versioned
#     <maj>.<min>.<patch+1>-dev.<commit time> (scripts/dev-version.mjs) and, with
#     the signing secret, also upload signed updater bundles + a `latest.json`
#     (publish-dev) for the in-app Dev update channel:
#     https://github.com/anslwy/vicuna/releases/download/latest/latest.json
#   * manual run with `version` (Actions → Build + release → Run workflow):
#     a versioned, signed release `v<version>` with Tauri updater bundles and
#     `latest.json`, which installed apps poll via
#     https://github.com/anslwy/vicuna/releases/latest/download/latest.json
#     (tauri.conf.json → plugins.updater). Mirrors cojudge's
#     .github/workflows/release-desktop.yml. Bump first with
#     `scripts/update-version.sh <version>` and merge to main.
#
# Updater signing uses the TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD) secrets.
# Without them dev builds still succeed (updater artifacts are skipped);
# versioned releases refuse to start.
#
# macOS local equivalent: `scripts/build-dmg.sh --universal`
# (universal = one binary for both Apple Silicon and Intel Macs).
name: Build + release (macOS, Windows, Linux)
run-name: ${{ inputs.version && format('Release Vicuna v{0}', inputs.version) || '' }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Release version from package.json, without the leading v (empty = rolling dev build only)
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version || github.ref }}
  cancel-in-progress: false

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  # Versioned releases only: versions agree, tag is new, signing is set up.
  validate:
    if: ${{ inputs.version }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate version and updater config
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const requested = process.env.VERSION;
          const packageVersion = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const conf = JSON.parse(readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const cargo = readFileSync('src-tauri/Cargo.toml', 'utf8');
          const cargoVersion = cargo.match(/^\[package\][\s\S]*?^version\s*=\s*"([^"]+)"/m)?.[1];
          const cliVersion = readFileSync('bridge/Cargo.toml', 'utf8').match(/^\[package\][\s\S]*?^version\s*=\s*"([^"]+)"/m)?.[1];

          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(requested)) {
            throw new Error(`Invalid release version: ${requested}`);
          }
          if (requested !== cliVersion) {
            throw new Error(`bridge/Cargo.toml (vicuna CLI) is ${cliVersion}, expected ${requested} (run scripts/update-version.sh ${requested})`);
          }
          if (requested !== packageVersion || requested !== cargoVersion || requested !== conf.version) {
            throw new Error(
              `Version mismatch: input=${requested}, package.json=${packageVersion}, Cargo.toml=${cargoVersion}, tauri.conf.json=${conf.version} (run scripts/update-version.sh ${requested})`
            );
          }
          const pubkey = conf.plugins?.updater?.pubkey ?? '';
          if (!pubkey || pubkey.startsWith('REPLACE_WITH')) {
            throw new Error('tauri.conf.json plugins.updater.pubkey is still the placeholder: paste the public key from `npx tauri signer generate`');
          }
          if (!conf.bundle?.createUpdaterArtifacts) {
            throw new Error('tauri.conf.json bundle.createUpdaterArtifacts must be true');
          }
          if (!process.env.TAURI_SIGNING_PRIVATE_KEY?.trim()) {
            throw new Error('Missing GitHub Actions secret TAURI_SIGNING_PRIVATE_KEY');
          }
          NODE

      - name: Ensure release does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi

  build-macos:
    needs: validate
    if: ${{ !cancelled() && needs.validate.result != 'failure' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - run: npm run check

      - name: Fetch lb browser sidecar (pinned)
        run: sh scripts/fetch-lb-sidecar.sh

      - name: Import Apple signing certificate & sign sidecars
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "Apple signing secrets not configured — skipping macOS signing."
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -base64 32)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

          # Tauri only auto-signs Contents/MacOS, Frameworks, and externalBin,
          # so sign the bundled lb-sidecar executables before bundling/notarizing.
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" \
            src-tauri/lb-sidecar/lb-arm64 src-tauri/lb-sidecar/lb-x64
          codesign --verify --verbose=2 src-tauri/lb-sidecar/lb-arm64 src-tauri/lb-sidecar/lb-x64
          echo "APPLE_SIGNED=1" >> "$GITHUB_ENV"

      # Rolling dev builds report <maj>.<min>.<patch+1>-dev.<commit time> so the
      # Dev update channel sees each push as newer (scripts/dev-version.mjs).
      - name: Dev build version
        if: ${{ !inputs.version }}
        shell: bash
        run: |
          v="$(node scripts/dev-version.mjs)"
          echo "DEV_VERSION=$v" >> "$GITHUB_ENV"
          echo "Dev build version: $v"

      # `app` must be built alongside `dmg`: the bundler only creates signed
      # updater artifacts (.app.tar.gz + .sig) for updater-enabled targets
      # (app, appimage, nsis, msi). Without the signing secret the updater
      # artifacts are switched off so dev builds keep working.
      - name: Build universal app + DMG
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "${APPLE_SIGNED:-}" = "1" ] && [ -n "${APPLE_SIGNING_IDENTITY_SECRET:-}" ]; then
            export APPLE_SIGNING_IDENTITY="$APPLE_SIGNING_IDENTITY_SECRET"
            if [ -n "${APPLE_ID_SECRET:-}" ] && [ -n "${APPLE_PASSWORD_SECRET:-}" ] && [ -n "${APPLE_TEAM_ID_SECRET:-}" ]; then
              export APPLE_ID="$APPLE_ID_SECRET"
              export APPLE_PASSWORD="$APPLE_PASSWORD_SECRET"
              export APPLE_TEAM_ID="$APPLE_TEAM_ID_SECRET"
            fi
          fi
          args=(--target universal-apple-darwin --bundles dmg,app)
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building without updater artifacts"
          fi
          # dev builds carry their dev version (see "Dev build version")
          cfg="$(node -e 'const c={};if(!process.env.TAURI_SIGNING_PRIVATE_KEY)c.bundle={createUpdaterArtifacts:false};if(process.env.DEV_VERSION)c.version=process.env.DEV_VERSION;process.stdout.write(JSON.stringify(c))')"
          if [ "$cfg" != "{}" ]; then args+=(--config "$cfg"); fi
          npx tauri build "${args[@]}"

      - name: Verify macOS signature & notarization
        if: ${{ env.APPLE_SIGNED == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/Vicuna.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute -vv "$APP_PATH"

      - name: Clean up signing keychain
        if: always()
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true

      - name: List bundle outputs (debug updater artifacts)
        shell: bash
        run: find src-tauri/target -path "*bundle*" \( -name "*.sig" -o -name "*.tar.gz" -o -name "*.dmg" \) -type f 2>/dev/null | sort || true

      - name: Upload release artifacts
        if: ${{ inputs.version }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/Vicuna_${{ inputs.version }}_universal.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload DMG to rolling release
        if: ${{ !inputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --prerelease --title "Latest dev build" || true
          gh release upload latest --clobber src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          # signed updater bundle for the Dev update channel (publish-dev writes latest.json)
          shopt -s nullglob
          upd=(src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig)
          if [ ${#upd[@]} -gt 0 ]; then gh release upload latest --clobber "${upd[@]}"; fi

      - name: Update release notes
        if: ${{ !inputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit latest --notes-file - <<'EOF'
          ## Install

          **macOS / Linux:**

             ```sh
             curl -fsSL https://raw.githubusercontent.com/anslwy/vicuna/main/install.sh | sh -s -- latest
             ```

          **Windows (PowerShell):**

             ```powershell
             $env:VICUNA_VERSION='latest'; irm https://raw.githubusercontent.com/anslwy/vicuna/main/install.ps1 | iex
             ```

          All three talk to Ollama at `http://localhost:11434`: install Ollama
          and run `ollama serve` (or start it from Settings → Models).
          EOF

  build-windows:
    needs: validate
    if: ${{ !cancelled() && needs.validate.result != 'failure' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Fetch lb browser sidecar (pinned)
        shell: bash
        run: sh scripts/fetch-lb-sidecar.sh

      - name: Check Windows SignPath config
        id: signpath
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ] && [ -n "${SIGNPATH_API_TOKEN:-}" ] && [ -n "${SIGNPATH_ORGANIZATION_ID:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            if [ -n "${{ inputs.version }}" ]; then
              echo "::warning::SIGNPATH_API_TOKEN / SIGNPATH_ORGANIZATION_ID not set — skipping Windows Authenticode signing."
            fi
          fi

      # Rolling dev builds report <maj>.<min>.<patch+1>-dev.<commit time> so the
      # Dev update channel sees each push as newer (scripts/dev-version.mjs).
      - name: Dev build version
        if: ${{ !inputs.version }}
        shell: bash
        run: |
          v="$(node scripts/dev-version.mjs)"
          echo "DEV_VERSION=$v" >> "$GITHUB_ENV"
          echo "Dev build version: $v"

      # Unsigned path (dev builds, or releases before SignPath secrets are set):
      # nsis = single self-contained setup.exe (the default "all" target
      # would also build an .msi, which needs a WiX toolchain on the runner)
      # (nsis is updater-enabled: with the signing secret it also emits
      # the -setup.exe.sig the Tauri updater verifies)
      - name: Build setup.exe (unsigned)
        if: steps.signpath.outputs.enabled != 'true'
        shell: bash
        run: |
          args=(--bundles nsis)
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building without updater artifacts"
          fi
          # dev builds carry their dev version (see "Dev build version")
          cfg="$(node -e 'const c={};if(!process.env.TAURI_SIGNING_PRIVATE_KEY)c.bundle={createUpdaterArtifacts:false};if(process.env.DEV_VERSION)c.version=process.env.DEV_VERSION;process.stdout.write(JSON.stringify(c))')"
          if [ "$cfg" != "{}" ]; then args+=(--config "$cfg"); fi
          npx tauri build "${args[@]}"

      # Signed path (versioned releases with SignPath Foundation):
      # 1. Build vicuna.exe without bundling.
      # 2. Sign vicuna.exe + bundled lb.exe via SignPath and verify signatures.
      # 3. Bundle NSIS with --no-binary-patching so vicuna.exe keeps its signature.
      # 4. Sign Vicuna_<version>_x64-setup.exe via SignPath and verify signature.
      # 5. Re-sign the signed setup.exe with Tauri's updater key so .sig matches.
      - name: Build Windows binary (no bundle)
        if: steps.signpath.outputs.enabled == 'true'
        shell: bash
        run: npx tauri build --no-bundle

      - name: Upload unsigned Windows binaries for SignPath
        if: steps.signpath.outputs.enabled == 'true'
        id: upload-win-bins
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-binaries
          path: |
            src-tauri/target/release/vicuna.exe
            src-tauri/lb-sidecar/lb.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign Windows binaries via SignPath
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'vicuna' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-win-bins.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-windows-bins

      - name: Install and verify signed Windows binaries
        if: steps.signpath.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $vicuna = Get-ChildItem -Path signed-windows-bins -Recurse -Filter "vicuna.exe" | Select-Object -First 1
          $lb = Get-ChildItem -Path signed-windows-bins -Recurse -Filter "lb.exe" | Select-Object -First 1
          if (-not $vicuna) { throw "Signed vicuna.exe not found in signed-windows-bins" }
          if (-not $lb) { throw "Signed lb.exe not found in signed-windows-bins" }
          Copy-Item -Force $vicuna.FullName "src-tauri/target/release/vicuna.exe"
          Copy-Item -Force $lb.FullName "src-tauri/lb-sidecar/lb.exe"
          foreach ($f in @("src-tauri/target/release/vicuna.exe", "src-tauri/lb-sidecar/lb.exe")) {
            $sig = Get-AuthenticodeSignature $f
            Write-Host "$f : $($sig.Status) ($($sig.SignerCertificate.Subject))"
            if ($sig.Status -ne 'Valid') { throw "Invalid Authenticode signature on $f`: $($sig.Status)" }
          }

      - name: Bundle NSIS setup.exe (preserving signed binaries)
        if: steps.signpath.outputs.enabled == 'true'
        shell: bash
        run: npx tauri bundle --bundles nsis --no-sign --no-binary-patching

      - name: Upload unsigned NSIS setup.exe for SignPath
        if: steps.signpath.outputs.enabled == 'true'
        id: upload-win-nsis
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-nsis
          path: src-tauri/target/release/bundle/nsis/Vicuna_${{ inputs.version }}_x64-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign NSIS setup.exe via SignPath
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'vicuna' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-win-nsis.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-windows-nsis

      - name: Install and verify signed NSIS setup.exe
        if: steps.signpath.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $dest = "src-tauri/target/release/bundle/nsis/Vicuna_${{ inputs.version }}_x64-setup.exe"
          $signed = Get-ChildItem -Path signed-windows-nsis -Recurse -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $signed) { throw "Signed setup.exe not found in signed-windows-nsis" }
          Copy-Item -Force $signed.FullName $dest
          $sig = Get-AuthenticodeSignature $dest
          Write-Host "$dest : $($sig.Status) ($($sig.SignerCertificate.Subject))"
          if ($sig.Status -ne 'Valid') { throw "Invalid Authenticode signature on $dest`: $($sig.Status)" }

      - name: Re-sign NSIS setup.exe for Tauri updater
        if: steps.signpath.outputs.enabled == 'true'
        shell: bash
        run: |
          npx tauri signer sign --app-version "${{ inputs.version }}" \
            "src-tauri/target/release/bundle/nsis/Vicuna_${{ inputs.version }}_x64-setup.exe"

      - name: Upload release artifacts
        if: ${{ inputs.version }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            src-tauri/target/release/bundle/nsis/Vicuna_${{ inputs.version }}_x64-setup.exe
            src-tauri/target/release/bundle/nsis/Vicuna_${{ inputs.version }}_x64-setup.exe.sig
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload setup.exe to rolling release
        if: ${{ !inputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --prerelease --title "Latest dev build" || true
          shopt -s nullglob
          gh release upload latest --clobber src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/nsis/*.exe.sig

  build-linux:
    needs: validate
    if: ${{ !cancelled() && needs.validate.result != 'failure' }}
    # 22.04 for the older glibc: the AppImage runs on more distros
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci

      - name: Fetch lb browser sidecar (pinned)
        run: sh scripts/fetch-lb-sidecar.sh

      # Rolling dev builds report <maj>.<min>.<patch+1>-dev.<commit time> so the
      # Dev update channel sees each push as newer (scripts/dev-version.mjs).
      - name: Dev build version
        if: ${{ !inputs.version }}
        shell: bash
        run: |
          v="$(node scripts/dev-version.mjs)"
          echo "DEV_VERSION=$v" >> "$GITHUB_ENV"
          echo "Dev build version: $v"

      # AppImage is the auto-updatable Linux bundle (.AppImage + .sig);
      # .deb installs update by downloading the new package.
      - name: Build AppImage + deb
        run: |
          args=(--bundles appimage,deb)
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building without updater artifacts"
          fi
          # dev builds carry their dev version (see "Dev build version")
          cfg="$(node -e 'const c={};if(!process.env.TAURI_SIGNING_PRIVATE_KEY)c.bundle={createUpdaterArtifacts:false};if(process.env.DEV_VERSION)c.version=process.env.DEV_VERSION;process.stdout.write(JSON.stringify(c))')"
          if [ "$cfg" != "{}" ]; then args+=(--config "$cfg"); fi
          npx tauri build "${args[@]}"

      - name: Upload release artifacts
        if: ${{ inputs.version }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            src-tauri/target/release/bundle/appimage/Vicuna_${{ inputs.version }}_amd64.AppImage
            src-tauri/target/release/bundle/appimage/Vicuna_${{ inputs.version }}_amd64.AppImage.sig
            src-tauri/target/release/bundle/deb/Vicuna_${{ inputs.version }}_amd64.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload AppImage + deb to rolling release
        if: ${{ !inputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --prerelease --title "Latest dev build" || true
          shopt -s nullglob
          gh release upload latest --clobber src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/appimage/*.AppImage.sig src-tauri/target/release/bundle/deb/*.deb

  # The `vicuna` CLI (`vicuna serve`, `vicuna open`): headless build of the
  # bridge crate — no `desktop` feature and no `tauri`, so Linux binaries build
  # statically against musl (zero glibc version dependency, no WebKit/GTK or
  # OpenSSL) for both x86_64 and aarch64.
  build-cli:
    needs: validate
    if: ${{ !cancelled() && needs.validate.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x86_64, os: ubuntu-22.04, rust_target: x86_64-unknown-linux-musl }
          - { target: linux-aarch64, os: ubuntu-24.04-arm, rust_target: aarch64-unknown-linux-musl }
          - { target: macos-universal, os: macos-latest, rust_target: 'aarch64-apple-darwin,x86_64-apple-darwin' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge -> target
          key: cli-${{ matrix.target }}

      # `vicuna web` embeds the built SvelteKit app (bridge/build.rs reads
      # ../build), so build the frontend before the binary
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build web UI
        run: |
          npm ci
          npm run build
          test -f build/index.html

      - name: Install musl toolchain (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools binutils

      - name: Build vicuna
        working-directory: bridge
        run: |
          set -euo pipefail
          mkdir -p target/release
          if [ "${{ matrix.target }}" = "macos-universal" ]; then
            cargo build --release --bin vicuna --target aarch64-apple-darwin
            cargo build --release --bin vicuna --target x86_64-apple-darwin
            lipo -create -output target/release/vicuna \
              target/aarch64-apple-darwin/release/vicuna target/x86_64-apple-darwin/release/vicuna
          else
            case "${{ matrix.rust_target }}" in
              x86_64-unknown-linux-musl) export CC_x86_64_unknown_linux_musl=musl-gcc ;;
              aarch64-unknown-linux-musl) export CC_aarch64_unknown_linux_musl=musl-gcc ;;
            esac
            cargo build --release --bin vicuna --target "${{ matrix.rust_target }}"
            cp "target/${{ matrix.rust_target }}/release/vicuna" target/release/vicuna
            # Must be a static musl binary: no shared library dependencies, no
            # glibc version floor, no dynamic interpreter.
            if readelf -d target/release/vicuna 2>/dev/null | grep -q NEEDED; then
              echo "::error::vicuna has dynamic NEEDED libraries" >&2
              readelf -d target/release/vicuna >&2
              exit 1
            fi
            if readelf -l target/release/vicuna 2>/dev/null | grep -q INTERP; then
              echo "::error::vicuna has a dynamic interpreter (not static)" >&2
              readelf -l target/release/vicuna >&2
              exit 1
            fi
          fi
          ./target/release/vicuna --version
          # ship the pinned lb with the CLI so `vicuna serve` runs it instead
          # of whatever `lb` is on the server's PATH (install-cli.sh/upgrade
          # put it in <prefix>/share/vicuna/lb-sidecar)
          sh ../scripts/fetch-lb-sidecar.sh
          cp -R ../src-tauri/lb-sidecar target/release/lb-sidecar

      - name: Sign & notarize macOS CLI
        if: ${{ matrix.target == 'macos-universal' }}
        working-directory: bridge
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "Apple signing secrets not configured — skipping macOS CLI signing."
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/cli-signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -base64 32)"
          CERT_PATH="$RUNNER_TEMP/cli-certificate.p12"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" \
            target/release/vicuna \
            target/release/lb-sidecar/lb-arm64 \
            target/release/lb-sidecar/lb-x64
          codesign --verify --verbose=2 \
            target/release/vicuna \
            target/release/lb-sidecar/lb-arm64 \
            target/release/lb-sidecar/lb-x64

          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            NOTARY_ZIP="$RUNNER_TEMP/vicuna-cli-notary.zip"
            zip -j "$NOTARY_ZIP" \
              target/release/vicuna \
              target/release/lb-sidecar/lb-arm64 \
              target/release/lb-sidecar/lb-x64
            OUT="$(xcrun notarytool submit "$NOTARY_ZIP" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait --output-format json)"
            echo "$OUT"
            STATUS="$(printf '%s' "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')"
            SUB_ID="$(printf '%s' "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))')"
            rm -f "$NOTARY_ZIP"
            if [ "$STATUS" != "Accepted" ]; then
              echo "::error::CLI notarization failed with status: $STATUS"
              [ -n "$SUB_ID" ] && xcrun notarytool log "$SUB_ID" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" || true
              exit 1
            fi
          fi

      - name: Clean up CLI signing keychain
        if: ${{ always() && matrix.target == 'macos-universal' }}
        run: security delete-keychain "$RUNNER_TEMP/cli-signing.keychain-db" 2>/dev/null || true

      - name: Package vicuna CLI
        working-directory: bridge
        run: |
          set -euo pipefail
          mkdir -p ../dist
          tar -C target/release -czf ../dist/vicuna-${{ matrix.target }}.tar.gz vicuna lb-sidecar
          cd ../dist
          (command -v sha256sum >/dev/null && sha256sum vicuna-${{ matrix.target }}.tar.gz || shasum -a 256 vicuna-${{ matrix.target }}.tar.gz) > vicuna-${{ matrix.target }}.tar.gz.sha256

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload CLI to rolling release
        if: ${{ !inputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --prerelease --title "Latest dev build" || true
          gh release upload latest --clobber dist/* scripts/install-cli.sh

  # Rolling dev builds only: write latest.json for the Dev update channel
  # (https://github.com/anslwy/vicuna/releases/download/latest/latest.json) and
  # drop desktop assets left over from earlier dev versions. Without the
  # updater signing secret there are no signed bundles, so only the cleanup runs.
  publish-dev:
    needs: [build-macos, build-windows, build-linux]
    if: ${{ !cancelled() && !inputs.version && needs.build-macos.result == 'success' && needs.build-windows.result == 'success' && needs.build-linux.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dev build version
        run: |
          v="$(node scripts/dev-version.mjs)"
          echo "DEV_VERSION=$v" >> "$GITHUB_ENV"
          echo "Dev build version: $v"

      - name: Generate + upload dev latest.json
        if: ${{ env.TAURI_SIGNING_PRIVATE_KEY != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dev"
          cd "$RUNNER_TEMP/dev"
          gh release download latest --repo "$REPO" --pattern '*.sig' --clobber
          export NOTES="Dev build $(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD): $(git -C "$GITHUB_WORKSPACE" log -1 --format=%s)"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, existsSync } from 'node:fs';
          const v = process.env.DEV_VERSION;
          const base = `https://github.com/${process.env.REPO}/releases/download/latest`;
          const bundles = {
            mac: 'Vicuna.app.tar.gz',
            win: `Vicuna_${v}_x64-setup.exe`,
            linux: `Vicuna_${v}_amd64.AppImage`
          };
          function sig(name) {
            const f = `${name}.sig`;
            if (!existsSync(f)) throw new Error(`Missing signature ${f} on the latest prerelease`);
            const s = readFileSync(f, 'utf8').trim();
            if (!s) throw new Error(`Signature ${f} is empty`);
            return s;
          }
          const entry = (name) => ({ signature: sig(name), url: `${base}/${name}` });
          const manifest = {
            version: v,
            notes: process.env.NOTES,
            pub_date: new Date().toISOString(),
            platforms: {
              'darwin-aarch64': entry(bundles.mac),
              'darwin-x86_64': entry(bundles.mac),
              'linux-x86_64': entry(bundles.linux),
              'windows-x86_64': entry(bundles.win)
            }
          };
          writeFileSync('latest.json', JSON.stringify(manifest, null, 2) + '\n');
          console.log(JSON.stringify(manifest, null, 2));
          NODE
          gh release upload latest --repo "$REPO" --clobber latest.json

      - name: Remove desktop assets from earlier dev versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh release view latest --repo "$REPO" --json assets -q '.assets[].name' | while read -r name; do
            if [[ "$name" =~ ^Vicuna_(.+)_(universal\.dmg|x64-setup\.exe(\.sig)?|amd64\.(AppImage|deb)(\.sig)?)$ ]] && [ "${BASH_REMATCH[1]}" != "$DEV_VERSION" ]; then
              echo "Deleting stale $name"
              gh release delete-asset latest "$name" --repo "$REPO" --yes || true
            fi
          done

  # Versioned releases only: one GitHub release `v<version>` with every
  # installer, the updater bundles + signatures, and latest.json.
  publish:
    needs: [validate, build-macos, build-windows, build-linux, build-cli]
    if: ${{ inputs.version }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/install-cli.sh
          sparse-checkout-cone-mode: false
          path: src

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: release
          merge-multiple: true

      - name: Add the CLI installer
        run: cp src/scripts/install-cli.sh release/install-cli.sh

      # upload-artifact keeps each file's relative path, so bundles land in
      # nested dirs. Flatten everything to release/ so verification,
      # latest.json generation and `gh release create release/*` see them.
      - name: Flatten downloaded artifacts
        run: |
          find release -mindepth 2 -type f -exec mv -n {} release/ \;
          find release -mindepth 1 -depth -type d -exec rm -rf {} +
          echo "=== release/ ==="
          ls -la release/

      - name: Verify release assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, statSync } from 'node:fs';

          const version = process.env.VERSION;
          const expected = [
            `Vicuna_${version}_universal.dmg`,
            `Vicuna_${version}_x64-setup.exe`,
            `Vicuna_${version}_x64-setup.exe.sig`,
            `Vicuna_${version}_amd64.AppImage`,
            `Vicuna_${version}_amd64.AppImage.sig`,
            `Vicuna_${version}_amd64.deb`,
            'vicuna-linux-x86_64.tar.gz',
            'vicuna-linux-aarch64.tar.gz',
            'vicuna-macos-universal.tar.gz',
            'install-cli.sh'
          ];
          const files = readdirSync('release', { withFileTypes: true })
            .filter((entry) => entry.isFile())
            .map((entry) => entry.name);
          for (const name of expected) {
            if (!files.includes(name)) throw new Error(`Missing asset: ${name} (found: ${JSON.stringify(files)})`);
            if (statSync(`release/${name}`).size === 0) throw new Error(`${name} is empty`);
          }
          if (!files.some((n) => n.endsWith('.app.tar.gz')) || !files.some((n) => n.endsWith('.app.tar.gz.sig'))) {
            throw new Error(`Missing macOS updater bundle/sig: ${JSON.stringify(files)}`);
          }
          NODE

      - name: Generate latest.json for Tauri updater
        env:
          VERSION: ${{ inputs.version }}
          TAG: v${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync, writeFileSync, statSync } from 'node:fs';

          const version = process.env.VERSION;
          const base = `https://github.com/${process.env.REPO}/releases/download/${process.env.TAG}`;
          const files = readdirSync('release', { withFileTypes: true })
            .filter((e) => e.isFile())
            .map((e) => e.name);
          const pick = (re) => files.find((n) => re.test(n)) ?? null;

          // macOS universal updater bundle (same file serves both archs)
          const macBundle = pick(/\.app\.tar\.gz$/);
          // Windows: the nsis setup.exe is the updater bundle (updater >= 2.10)
          const winBundle = pick(/-setup\.exe$/);
          // Linux: AppImage is the auto-updatable bundle (deb needs a manual reinstall)
          const linuxBundle = pick(/\.AppImage$/);
          if (!macBundle || !winBundle || !linuxBundle) {
            throw new Error(`Updater bundle missing in ${JSON.stringify(files)}`);
          }

          function sigFor(bundle) {
            const sig = `${bundle}.sig`;
            if (!files.includes(sig)) throw new Error(`Missing signature ${sig}`);
            const content = readFileSync(`release/${sig}`, 'utf8').trim();
            if (!content) throw new Error(`Signature ${sig} is empty`);
            return content;
          }

          const manifest = {
            version,
            pub_date: new Date().toISOString(),
            platforms: {
              'darwin-aarch64': { signature: sigFor(macBundle), url: `${base}/${macBundle}` },
              'darwin-x86_64': { signature: sigFor(macBundle), url: `${base}/${macBundle}` },
              'linux-x86_64': { signature: sigFor(linuxBundle), url: `${base}/${linuxBundle}` },
              'windows-x86_64': { signature: sigFor(winBundle), url: `${base}/${winBundle}` }
            }
          };
          for (const [platform, entry] of Object.entries(manifest.platforms)) {
            const filename = entry.url.split('/').pop();
            if (statSync(`release/${filename}`).size === 0) throw new Error(`Updater bundle for ${platform} is empty`);
          }
          writeFileSync('release/latest.json', JSON.stringify(manifest, null, 2) + '\n');
          console.log(JSON.stringify(manifest, null, 2));
          NODE

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ inputs.version }}
          RELEASE_NOTES: |
            ## Automatic updates

            Vicuna checks `github.com/anslwy/vicuna/releases` for new versions on startup.
            Use **Settings → App updates → Check for updates** to check manually, install in-app, and restart to apply.

            - macOS (universal `.dmg` / `.app.tar.gz`): in-app install supported when launched from `/Applications`.
            - Windows (`-setup.exe`): in-app install supported; the installer restarts the app automatically.
            - Linux: in-app install supported for the `.AppImage`. If you installed the `.deb`, download the new package manually.

            ## Install

            **macOS / Linux:**

            ```sh
            curl -fsSL https://raw.githubusercontent.com/anslwy/vicuna/main/install.sh | sh -s -- v${{ inputs.version }}
            ```

            **Windows (PowerShell):**

            ```powershell
            $env:VICUNA_VERSION='v${{ inputs.version }}'; irm https://raw.githubusercontent.com/anslwy/vicuna/main/install.ps1 | iex
            ```

            All builds talk to Ollama at `http://localhost:11434`: install Ollama and run `ollama serve` (or start it from Settings → Models).

            ## Vicuna server (headless, for a VPS or another machine)

            ```sh
            curl -fsSL https://github.com/anslwy/vicuna/releases/download/v${{ inputs.version }}/install-cli.sh | VICUNA_VERSION=${{ inputs.version }} sh
            vicuna serve --tailscale                # prints the URL + token to paste into the app
            vicuna install-service --tailscale      # keep it running (systemd user unit / launchd)
            ```

            The same `vicuna` command opens folders in the desktop app: `vicuna open [path]`.
        run: |
          release_args=()
          if [[ "$TAG" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "Vicuna $TAG" \
            --generate-notes \
            --notes "$RELEASE_NOTES" \
            "${release_args[@]}"

  winget:
    # Same as cojudge: after a stable release, open the winget-pkgs update PR
    # (Vicuna.Vicuna). Needs secret WINGET_TOKEN: a classic PAT with public_repo
    # for the anslwy account (fork anslwy/winget-pkgs). Skips pre-releases and
    # rolling dev builds; a missing token skips instead of failing the release.
    needs: publish
    if: ${{ inputs.version && !contains(inputs.version, '-') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Check WINGET_TOKEN
        id: tok
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -n "$WINGET_TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::warning::WINGET_TOKEN is not set; skipping winget submission"; fi
      - if: steps.tok.outputs.ok == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Vicuna.Vicuna
          installers-regex: 'x64-setup\.exe$'
          release-tag: v${{ inputs.version }}
          fork-user: anslwy
          token: ${{ secrets.WINGET_TOKEN }}

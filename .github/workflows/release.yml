# Build the desktop app for macOS / Windows / Linux.
#
# Two modes (same build jobs):
#   * push to main (or a manual run with no version): attach the installers
#     to the rolling `latest` prerelease (dev builds, as before).
#   * manual run with `version` (Actions → Build + release → Run workflow):
#     a versioned, signed release `v<version>` with Tauri updater bundles and
#     `latest.json`, which installed apps poll via
#     https://github.com/anslwy/vicuna/releases/latest/download/latest.json
#     (tauri.conf.json → plugins.updater). Mirrors cojudge's
#     .github/workflows/release-desktop.yml. Bump first with
#     `scripts/update-version.sh <version>` and merge to main.
#
# Updater signing uses the TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD) secrets.
# Without them dev builds still succeed (updater artifacts are skipped);
# versioned releases refuse to start.
#
# macOS local equivalent: `scripts/build-dmg.sh --universal`
# (universal = one binary for both Apple Silicon and Intel Macs).
name: Build + release (macOS, Windows, Linux)
run-name: ${{ inputs.version && format('Release Vicuna v{0}', inputs.version) || '' }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Release version from package.json, without the leading v (empty = rolling dev build only)
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version || github.ref }}
  cancel-in-progress: false

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  # Versioned releases only: versions agree, tag is new, signing is set up.
  validate:
    if: ${{ inputs.version }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate version and updater config
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const requested = process.env.VERSION;
          const packageVersion = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const conf = JSON.parse(readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const cargo = readFileSync('src-tauri/Cargo.toml', 'utf8');
          const cargoVersion = cargo.match(/^\[package\][\s\S]*?^version\s*=\s*"([^"]+)"/m)?.[1];

          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(requested)) {
            throw new Error(`Invalid release version: ${requested}`);
          }
          if (requested !== packageVersion || requested !== cargoVersion || requested !== conf.version) {
            throw new Error(
              `Version mismatch: input=${requested}, package.json=${packageVersion}, Cargo.toml=${cargoVersion}, tauri.conf.json=${conf.version} (run scripts/update-version.sh ${requested})`
            );
          }
          const pubkey = conf.plugins?.updater?.pubkey ?? '';
          if (!pubkey || pubkey.startsWith('REPLACE_WITH')) {
            throw new Error('tauri.conf.json plugins.updater.pubkey is still the placeholder: paste the public key from `npx tauri signer generate`');
          }
          if (!conf.bundle?.createUpdaterArtifacts) {
            throw new Error('tauri.conf.json bundle.createUpdaterArtifacts must be true');
          }
          if (!process.env.TAURI_SIGNING_PRIVATE_KEY?.trim()) {
            throw new Error('Missing GitHub Actions secret TAURI_SIGNING_PRIVATE_KEY');
          }
          NODE

      - name: Ensure release does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi

  build-macos:
    needs: validate
    if: ${{ !cancelled() && needs.validate.result != 'failure' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - run: npm run check

      - name: Fetch lb browser sidecar (pinned)
        run: sh scripts/fetch-lb-sidecar.sh

      # `app` must be built alongside `dmg`: the bundler only creates signed
      # updater artifacts (.app.tar.gz + .sig) for updater-enabled targets
      # (app, appimage, nsis, msi). Without the signing secret the updater
      # artifacts are switched off so dev builds keep working.
      - name: Build universal app + DMG
        shell: bash
        run: |
          args=(--target universal-apple-darwin --bundles dmg,app)
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building without updater artifacts"
            args+=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          npx tauri build "${args[@]}"

      - name: List bundle outputs (debug updater artifacts)
        shell: bash
        run: find src-tauri/target -path "*bundle*" \( -name "*.sig" -o -name "*.tar.gz" -o -name "*.dmg" \) -type f 2>/dev/null | sort || true

      - name: Upload release artifacts
        if: ${{ inputs.version }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/Vicuna_${{ inputs.version }}_universal.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload DMG to rolling release
        if: ${{ !inputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --prerelease --title "Latest dev build" || true
          gh release upload latest --clobber src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: Update release notes
        if: ${{ !inputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit latest --notes-file - <<'EOF'
          ## Install

          **macOS** — Download the `.dmg` below, open it, and drag **Vicuna** to Applications.
          This build is unsigned, so macOS will block the first launch. Run once in Terminal:

             ```
             xattr -dr com.apple.quarantine /Applications/Vicuna.app
             ```

             then open Vicuna normally (or right-click → Open on first launch).

          **Windows** — Download and run the `-setup.exe` below. The build is
          unsigned, so SmartScreen will warn on first launch
          (More info → Run anyway).

          **Linux** — Download the `.AppImage` below, make it executable
          (`chmod +x *.AppImage`) and run it. A `.deb` package is attached
          too (`sudo dpkg -i *.deb`).

          All three talk to Ollama at `http://localhost:11434`: install Ollama
          and run `ollama serve` (or start it from Settings → Models).
          EOF

  build-windows:
    needs: validate
    if: ${{ !cancelled() && needs.validate.result != 'failure' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Fetch lb browser sidecar (pinned)
        shell: bash
        run: sh scripts/fetch-lb-sidecar.sh

      # nsis = single self-contained setup.exe (the default "all" target
      # would also build an .msi, which needs a WiX toolchain on the runner)
      # (nsis is updater-enabled: with the signing secret it also emits
      # the -setup.exe.sig the Tauri updater verifies)
      - name: Build setup.exe
        shell: bash
        run: |
          args=(--bundles nsis)
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building without updater artifacts"
            args+=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          npx tauri build "${args[@]}"

      - name: Upload release artifacts
        if: ${{ inputs.version }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            src-tauri/target/release/bundle/nsis/Vicuna_${{ inputs.version }}_x64-setup.exe
            src-tauri/target/release/bundle/nsis/Vicuna_${{ inputs.version }}_x64-setup.exe.sig
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload setup.exe to rolling release
        if: ${{ !inputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --prerelease --title "Latest dev build" || true
          gh release upload latest --clobber src-tauri/target/release/bundle/nsis/*.exe

  build-linux:
    needs: validate
    if: ${{ !cancelled() && needs.validate.result != 'failure' }}
    # 22.04 for the older glibc: the AppImage runs on more distros
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci

      - name: Fetch lb browser sidecar (pinned)
        run: sh scripts/fetch-lb-sidecar.sh

      # AppImage is the auto-updatable Linux bundle (.AppImage + .sig);
      # .deb installs update by downloading the new package.
      - name: Build AppImage + deb
        run: |
          args=(--bundles appimage,deb)
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building without updater artifacts"
            args+=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          npx tauri build "${args[@]}"

      - name: Upload release artifacts
        if: ${{ inputs.version }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            src-tauri/target/release/bundle/appimage/Vicuna_${{ inputs.version }}_amd64.AppImage
            src-tauri/target/release/bundle/appimage/Vicuna_${{ inputs.version }}_amd64.AppImage.sig
            src-tauri/target/release/bundle/deb/Vicuna_${{ inputs.version }}_amd64.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload AppImage + deb to rolling release
        if: ${{ !inputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --prerelease --title "Latest dev build" || true
          gh release upload latest --clobber src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb

  # Versioned releases only: one GitHub release `v<version>` with every
  # installer, the updater bundles + signatures, and latest.json.
  publish:
    needs: [validate, build-macos, build-windows, build-linux]
    if: ${{ inputs.version }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true

      # upload-artifact keeps each file's relative path, so bundles land in
      # nested dirs. Flatten everything to release/ so verification,
      # latest.json generation and `gh release create release/*` see them.
      - name: Flatten downloaded artifacts
        run: |
          find release -mindepth 2 -type f -exec mv -n {} release/ \;
          find release -mindepth 1 -depth -type d -exec rm -rf {} +
          echo "=== release/ ==="
          ls -la release/

      - name: Verify release assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, statSync } from 'node:fs';

          const version = process.env.VERSION;
          const expected = [
            `Vicuna_${version}_universal.dmg`,
            `Vicuna_${version}_x64-setup.exe`,
            `Vicuna_${version}_x64-setup.exe.sig`,
            `Vicuna_${version}_amd64.AppImage`,
            `Vicuna_${version}_amd64.AppImage.sig`,
            `Vicuna_${version}_amd64.deb`
          ];
          const files = readdirSync('release', { withFileTypes: true })
            .filter((entry) => entry.isFile())
            .map((entry) => entry.name);
          for (const name of expected) {
            if (!files.includes(name)) throw new Error(`Missing asset: ${name} (found: ${JSON.stringify(files)})`);
            if (statSync(`release/${name}`).size === 0) throw new Error(`${name} is empty`);
          }
          if (!files.some((n) => n.endsWith('.app.tar.gz')) || !files.some((n) => n.endsWith('.app.tar.gz.sig'))) {
            throw new Error(`Missing macOS updater bundle/sig: ${JSON.stringify(files)}`);
          }
          NODE

      - name: Generate latest.json for Tauri updater
        env:
          VERSION: ${{ inputs.version }}
          TAG: v${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync, writeFileSync, statSync } from 'node:fs';

          const version = process.env.VERSION;
          const base = `https://github.com/${process.env.REPO}/releases/download/${process.env.TAG}`;
          const files = readdirSync('release', { withFileTypes: true })
            .filter((e) => e.isFile())
            .map((e) => e.name);
          const pick = (re) => files.find((n) => re.test(n)) ?? null;

          // macOS universal updater bundle (same file serves both archs)
          const macBundle = pick(/\.app\.tar\.gz$/);
          // Windows: the nsis setup.exe is the updater bundle (updater >= 2.10)
          const winBundle = pick(/-setup\.exe$/);
          // Linux: AppImage is the auto-updatable bundle (deb needs a manual reinstall)
          const linuxBundle = pick(/\.AppImage$/);
          if (!macBundle || !winBundle || !linuxBundle) {
            throw new Error(`Updater bundle missing in ${JSON.stringify(files)}`);
          }

          function sigFor(bundle) {
            const sig = `${bundle}.sig`;
            if (!files.includes(sig)) throw new Error(`Missing signature ${sig}`);
            const content = readFileSync(`release/${sig}`, 'utf8').trim();
            if (!content) throw new Error(`Signature ${sig} is empty`);
            return content;
          }

          const manifest = {
            version,
            pub_date: new Date().toISOString(),
            platforms: {
              'darwin-aarch64': { signature: sigFor(macBundle), url: `${base}/${macBundle}` },
              'darwin-x86_64': { signature: sigFor(macBundle), url: `${base}/${macBundle}` },
              'linux-x86_64': { signature: sigFor(linuxBundle), url: `${base}/${linuxBundle}` },
              'windows-x86_64': { signature: sigFor(winBundle), url: `${base}/${winBundle}` }
            }
          };
          for (const [platform, entry] of Object.entries(manifest.platforms)) {
            const filename = entry.url.split('/').pop();
            if (statSync(`release/${filename}`).size === 0) throw new Error(`Updater bundle for ${platform} is empty`);
          }
          writeFileSync('release/latest.json', JSON.stringify(manifest, null, 2) + '\n');
          console.log(JSON.stringify(manifest, null, 2));
          NODE

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ inputs.version }}
          RELEASE_NOTES: |
            ## Automatic updates

            Vicuna checks `github.com/anslwy/vicuna/releases` for new versions on startup.
            Use **Settings → App updates → Check for updates** to check manually, install in-app, and restart to apply.

            - macOS (universal `.dmg` / `.app.tar.gz`): in-app install supported when launched from `/Applications`.
            - Windows (`-setup.exe`): in-app install supported; the installer restarts the app automatically.
            - Linux: in-app install supported for the `.AppImage`. If you installed the `.deb`, download the new package manually.

            ## Install

            **macOS**: download the `.dmg`, open it and drag **Vicuna** to Applications. The build is not notarized, so run once before the first launch:

            ```bash
            xattr -dr com.apple.quarantine /Applications/Vicuna.app
            ```

            **Windows**: run `Vicuna_${{ inputs.version }}_x64-setup.exe`. The build is unsigned, so SmartScreen warns on first launch (More info → Run anyway).

            **Linux (x86_64)**: `chmod +x Vicuna_${{ inputs.version }}_amd64.AppImage` and run it, or `sudo apt install ./Vicuna_${{ inputs.version }}_amd64.deb`.

            All builds talk to Ollama at `http://localhost:11434`: install Ollama and run `ollama serve` (or start it from Settings → Models).
        run: |
          release_args=()
          if [[ "$TAG" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "Vicuna $TAG" \
            --generate-notes \
            --notes "$RELEASE_NOTES" \
            "${release_args[@]}"
